    <!-- Google Search Console verification meta tag can be placed here after obtaining from GSC -->

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;500;600;700;800&family=Noto+Naskh+Arabic:wght@400;500;600;700&family=Noto+Sans+Arabic:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var raw = localStorage.getItem('tibaa_user_settings_v1');
          if (raw) {
            var parsed = JSON.parse(raw);
            var isDark = false;
            if (parsed.theme === 'dark') isDark = true;
            else if (parsed.theme === 'light') isDark = false;
            else if (parsed.theme === 'system') isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            
            if (isDark) document.documentElement.classList.add('dark');
            else document.documentElement.classList.remove('dark');

            if (parsed.language) {
              document.documentElement.setAttribute('lang', parsed.language);
              document.documentElement.setAttribute('dir', parsed.language === 'ar' ? 'rtl' : 'ltr');
            }
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased selection:bg-emerald-500 selection:text-white dark:bg-slate-950 dark:text-slate-100 min-h-screen">

    <script type="module" src="/src/main.tsx"></script>
  </body>
